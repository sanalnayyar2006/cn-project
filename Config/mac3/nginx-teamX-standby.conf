upstream standby_backend_pool {
    server 127.0.0.1:5001 max_fails=1 fail_timeout=10s;
    server 127.0.0.1:5002 max_fails=1 fail_timeout=10s;
}

server {
    listen 443 ssl;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /Users/pexy/cn-phase2/tls/app.teamX.test.crt;
    ssl_certificate_key /Users/pexy/cn-phase2/tls/app.teamX.test.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    location / {
        proxy_pass http://standby_backend_pool;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_set_header Connection "";

        proxy_next_upstream error timeout http_502 http_503 http_504;

        add_header X-Edge mac3-standby always;
        add_header X-Upstream $upstream_addr always;
    }
}
