# Phase 1 edge configuration (extracted from the `nginx -T` dump taken before Phase 2).
# Backend IP at that time: 10.7.21.250. Certificate: self-signed, CN only.
upstream backend_pool {
    server 10.7.21.250:5001;
    server 10.7.21.250:5002;
}

server {
    listen 80;
    server_name app.teamX.test;

    location / {
        proxy_pass http://backend_pool;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 443 ssl;
    server_name app.teamX.test;

    ssl_certificate /Users/aarsh.user/teamX-tls/app.teamX.test.crt;
    ssl_certificate_key /Users/aarsh.user/teamX-tls/app.teamX.test.key;

    location / {
        proxy_pass http://backend_pool;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
