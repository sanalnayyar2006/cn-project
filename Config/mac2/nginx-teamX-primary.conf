upstream backend_pool {
    # passive health check: 1 failure => server marked down for 10s, then retried
    server 10.7.2.16:5001 max_fails=1 fail_timeout=10s;
    server 10.7.2.16:5002 max_fails=1 fail_timeout=10s;
}

server {
    listen 80;
    server_name app.teamX.test api.teamX.test;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.teamX.test api.teamX.test;

    ssl_certificate     /opt/homebrew/etc/nginx/tls/app.teamX.test.crt;
    ssl_certificate_key /opt/homebrew/etc/nginx/tls/app.teamX.test.key;

    # evidence headers
    add_header X-Edge     mac2-primary   always;
    add_header X-Upstream $upstream_addr always;   # shows "A, B" when a retry happened

    location / {
        proxy_pass http://backend_pool;

        proxy_connect_timeout 2s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_next_upstream_timeout 3s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
